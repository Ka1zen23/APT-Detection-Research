<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive MSc research publication on AI-based APT malware detection at Universiti Teknologi Brunei."
    />
    <meta name="color-scheme" content="light dark" />
    <title>APT Research Lab · UTB</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("apt-dashboard-theme");
          const dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch {
          document.documentElement.classList.toggle("dark", window.matchMedia("(prefers-color-scheme: dark)").matches);
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <noscript>
      <div style="max-width: 42rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1>APT Research Lab</h1>
        <p>
          This MSc project at Universiti Teknologi Brunei investigates whether AI can
          learn patterns of routine computer activity and highlight unusual events for investigation.
          Enable JavaScript to explore the methodology, preliminary findings and saved experimental evidence.
        </p>
      </div>
    </noscript>
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
