# Fly.io deployment for the read-only research API.
#
# This file intentionally lives at the repository root so `fly deploy
# --local-only` uses the full working tree, including ignored processed data.
# Change `app` to your own globally unique Fly app name.

app = "apt-research-api"
primary_region = "sin"

[build]
  dockerfile = "web/backend/Dockerfile"

[env]
  APT_DEPLOYMENT_MODE = "container"
  APT_REPO_ROOT = "/app"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
